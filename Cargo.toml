[package]
name = "sebo-do-lima"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
