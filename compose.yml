services:
  app:
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
    command: cargo run

  docs:
    image: swaggerapi/swagger-ui:v5.34.1
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SWAGGER_JSON: /spec/contract-api.yml
    volumes:
      - ./docs:/spec:ro

volumes:
  cargo-registry:
