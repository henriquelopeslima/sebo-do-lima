services:
  app:
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
    command: cargo run
    environment:
      DATABASE_URL: postgres://sebo:sebo@db:5432/sebo
    depends_on:
      db:
        condition: service_healthy
    init: true # cargo como PID 1 ignora SIGTERM e o stop levaria 10s
    ports:
      - "127.0.0.1:3000:3000"

  db:
    image: postgres:18-alpine
    # credenciais apenas de desenvolvimento; a porta não é publicada no host
    environment:
      POSTGRES_USER: sebo
      POSTGRES_PASSWORD: sebo
      POSTGRES_DB: sebo
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sebo -d sebo"]
      interval: 2s
      timeout: 2s
      retries: 15

  # uso: docker compose run --rm seed (a API precisa ter subido antes, pois é ela que cria as tabelas)
  seed:
    image: postgres:18-alpine
    profiles: [seed]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./seeds:/seeds:ro
    command: psql postgres://sebo:sebo@db:5432/sebo -v ON_ERROR_STOP=1 -f /seeds/books.sql -f /seeds/members.sql

  docs:
    image: swaggerapi/swagger-ui:v5.34.1
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SWAGGER_JSON: /spec/contract-api.yml
    volumes:
      - ./docs:/spec:ro

volumes:
  cargo-registry:
  db-data:
