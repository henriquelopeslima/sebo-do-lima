name: Coverage

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sebo
          POSTGRES_PASSWORD: sebo
          POSTGRES_DB: sebo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sebo -d sebo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sebo:sebo@localhost:5432/sebo
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # piso = cobertura de linhas na época da criação (95,35%); só sobe, nunca desce
      - name: Cobertura
        run: cargo llvm-cov --locked --fail-under-lines 95
